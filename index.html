<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIOT US TikTok Shop - 업무 대시보드</title>
  <style>
    :root {
      --accent: #C8956D;
      --text-primary: #1F2937;
      --text-secondary: #6B7280;
      --bg-primary: #FFFFFF;
      --bg-secondary: #F9FAFB;
      --border: #E5E7EB;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg-secondary); color: var(--text-primary); }
    .container { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }
    h1 { font-size: 24px; color: var(--accent); margin-bottom: 20px; }
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin: 20px 0; }
    .kpi-card { background: var(--bg-primary); padding: 20px; border-radius: 8px; text-align: center; border: 1px solid var(--border); }
    .kpi-value { font-size: 32px; font-weight: 700; color: var(--accent); margin: 10px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 SIOT US TikTok Shop - 업무 대시보드</h1>
    <p>대시보드가 로드 중입니다... 잠시만 기다려주세요!</p>
    <div class="kpi-grid">
      <div class="kpi-card">
        <div>GMV</div>
        <div class="kpi-value">$0</div>
      </div>
      <div class="kpi-card">
        <div>ROI</div>
        <div class="kpi-value">0</div>
      </div>
      <div class="kpi-card">
        <div>영상 수</div>
        <div class="kpi-value">0</div>
      </div>
    </div>
  </div>
  <script>
    console.log('대시보드 준비 완료!');
  </script>
</body>
</html>
